<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050308">
<title>DonsXD Quantum</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050308;--r:#ff1f3d;--r2:#ff5470;--tx:#f6ecef;--mu:#b79ca7;--ok:#3dffb0;--ko:#ff3b5c;--e:cubic-bezier(.2,.8,.2,1);--cut:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
html{background:#050308}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 "Chakra Petch",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.aura{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(70px);opacity:.5;animation:dr 14s ease-in-out infinite alternate}
.a1{background:radial-gradient(circle,rgba(255,31,61,.55),transparent 62%);left:-45vmax;top:-40vmax}
.a2{background:radial-gradient(circle,rgba(160,0,40,.55),transparent 62%);right:-50vmax;bottom:-45vmax;animation-delay:-6s}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.floor{position:absolute;left:-60%;right:-60%;bottom:-2%;height:55vh;background-image:linear-gradient(rgba(255,31,61,.42) 1px,transparent 1px),linear-gradient(90deg,rgba(255,31,61,.42) 1px,transparent 1px);background-size:56px 56px;transform:perspective(360px) rotateX(64deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent 80%);mask-image:linear-gradient(to top,#000,transparent 80%);animation:fl 2.2s linear infinite}
@keyframes fl{to{background-position:0 56px}}
.bolts{position:absolute;inset:0;width:100%;height:100%}
.bolt{fill:none;stroke:#ff3355;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:bevel;opacity:0;filter:drop-shadow(0 0 5px #ff1f3d) drop-shadow(0 0 18px #ff1f3d);animation:fk 7s infinite}
.bolt:nth-child(2){animation-duration:9s;animation-delay:-3s}.bolt:nth-child(3){animation-duration:12s;animation-delay:-7s}
.run .bolt{animation-duration:3.2s}.run .bolt:nth-child(2){animation-duration:4.1s}.run .bolt:nth-child(3){animation-duration:5.3s}
@keyframes fk{0%,90%,100%{opacity:0}91%{opacity:1}92%{opacity:.15}93.5%{opacity:.95}96%{opacity:0}}
main{position:relative;z-index:1;max-width:480px;margin:auto}
header{display:flex;align-items:center;gap:10px}
header svg{filter:drop-shadow(0 0 8px #ff1f3d)}
header b{font-weight:700;font-size:1.1rem;letter-spacing:3px;text-shadow:0 0 14px rgba(255,31,61,.8);animation:neon 5s infinite}header b span{color:var(--r2)}
@keyframes neon{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.7}}
.dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#5a3b45;transition:.4s}
.run .dot{background:var(--r);box-shadow:0 0 0 4px rgba(255,31,61,.2),0 0 16px var(--r);animation:beat 1.4s infinite}
@keyframes beat{50%{box-shadow:0 0 0 10px rgba(255,31,61,0),0 0 22px var(--r)}}
.orb{--rx:0deg;--ry:0deg;width:min(76vw,300px);aspect-ratio:1;margin:22px auto 14px;position:relative;display:grid;place-items:center;perspective:800px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s var(--e)}
.halo{position:absolute;inset:-18%;border-radius:50%;clip-path:circle(50%);background:radial-gradient(circle,rgba(255,31,61,.45),transparent 62%);filter:blur(14px);animation:hl 3.2s ease-in-out infinite;transform:translateZ(-60px)}
@keyframes hl{50%{transform:translateZ(-60px) scale(1.14);opacity:.7}}
.gyro{position:absolute;inset:2%;transform-style:preserve-3d;animation:gy 20s linear infinite}.run .gyro{animation-duration:6s}
.gyro i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,60,90,.9);box-shadow:0 0 16px rgba(255,31,61,.8),inset 0 0 16px rgba(255,31,61,.45)}
.gyro i:nth-child(1){transform:rotateX(74deg)}.gyro i:nth-child(2){transform:rotateY(74deg);inset:7%}.gyro i:nth-child(3){transform:rotateX(38deg) rotateY(38deg);inset:15%;border-style:dashed;opacity:.75}
@keyframes gy{from{transform:rotateX(16deg) rotateY(0)}to{transform:rotateX(16deg) rotateY(360deg)}}
.sweep{position:absolute;inset:6%;border-radius:50%;clip-path:circle(50%);opacity:0;transition:opacity .8s;background:conic-gradient(from 0deg,transparent 0 60%,rgba(255,31,61,.5));-webkit-mask:radial-gradient(circle,transparent 36%,#000 37%);mask:radial-gradient(circle,transparent 36%,#000 37%);animation:sp 2.6s linear infinite}
.run .sweep{opacity:1}@keyframes sp{to{transform:rotate(360deg)}}
.core{position:relative;width:56%;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;transform:translateZ(46px);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.28),rgba(255,31,61,.22) 38%,rgba(12,0,5,.82) 78%);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);box-shadow:inset 0 0 26px rgba(255,31,61,.5),0 0 40px rgba(255,31,61,.55),0 18px 40px rgba(0,0,0,.6)}
.core small{color:var(--mu);font-size:.68rem;letter-spacing:3px}
.core strong{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,31,61,.9)}
.state{font-size:.72rem;color:var(--r2);min-height:1.2em;margin-top:2px}
.rip{position:absolute;inset:22%;border-radius:50%;border:2px solid var(--r);box-shadow:0 0 20px var(--r);animation:rip 1.4s var(--e) forwards;pointer-events:none}
@keyframes rip{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(2.7)}}
body.zap::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,31,61,.4),transparent 62%);animation:zp .65s ease-out forwards}
@keyframes zp{from{opacity:1}to{opacity:0}}
.stats{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,70,100,.3);border-radius:99px;padding:7px 16px;font-size:.85rem;backdrop-filter:blur(14px);font-variant-numeric:tabular-nums}
.pill i{font-style:normal;font-weight:700}.pill.w i{color:var(--ok);text-shadow:0 0 10px var(--ok)}.pill.l i{color:var(--ko);text-shadow:0 0 10px var(--ko)}
.bump{animation:bp .5s var(--e)}@keyframes bp{40%{transform:scale(1.2)}}
.gow{filter:drop-shadow(0 0 14px rgba(255,31,61,.7));margin-bottom:16px}
.go{width:100%;border:0;clip-path:var(--cut);padding:18px;font:700 1rem "Chakra Petch",sans-serif;letter-spacing:4px;text-transform:uppercase;color:#fff;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(135deg,#ff1f3d,#a8001f);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 0 10px rgba(0,0,0,.5);transition:transform .15s,background .4s}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4),transparent 65%);transform:translateX(-120%);animation:sh 3.4s infinite}
@keyframes sh{40%,100%{transform:translateX(120%)}}
.go:active{transform:scale(.96)}.run .go{background:#12040a;box-shadow:inset 0 0 0 2px var(--r),inset 0 0 24px rgba(255,31,61,.55);color:var(--r2)}
.go.busy{opacity:.7}
.card{background:linear-gradient(150deg,rgba(255,50,80,.12),rgba(255,255,255,.035));border:1px solid rgba(255,80,110,.24);border-radius:22px;padding:18px;margin-bottom:14px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px -24px rgba(255,31,61,.55)}
.card h2{font-size:.78rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--r2);margin:0 0 12px}
.card.off{opacity:.45;pointer-events:none;transition:opacity .4s}
label{display:block;font-size:.76rem;color:var(--mu);margin:14px 0 6px;letter-spacing:1px}label:first-of-type{margin-top:0}
input{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,80,110,.22);border-radius:12px;padding:12px 14px;color:var(--tx);font:inherit;transition:.25s}
input:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 3px rgba(255,31,61,.2),0 0 18px rgba(255,31,61,.35)}
.seg{display:flex;background:rgba(0,0,0,.4);border-radius:12px;padding:3px;gap:3px;border:1px solid rgba(255,80,110,.14)}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:.82rem;padding:10px 0;border-radius:9px;cursor:pointer;transition:.3s var(--e)}
.seg button.on{background:linear-gradient(135deg,rgba(255,31,61,.5),rgba(168,0,31,.5));color:#fff;box-shadow:0 0 16px rgba(255,31,61,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.4);border-radius:12px;padding:4px;border:1px solid rgba(255,80,110,.14)}
.step button{width:42px;height:42px;border:0;clip-path:var(--cut);background:linear-gradient(135deg,#ff1f3d,#a8001f);color:#fff;font-size:1.3rem;cursor:pointer;transition:transform .15s}
.step button:active{transform:scale(.85)}.step span{font-weight:700;font-size:1.2rem;text-shadow:0 0 12px var(--r)}
.lad{display:flex;gap:6px;margin:14px 0 12px;height:8px}
.lad i{flex:1;border-radius:4px;background:rgba(255,255,255,.08);transition:.4s var(--e)}
.lad i.p{background:rgba(255,31,61,.4)}.lad i.a{background:#fff;transform:scaleY(1.8);box-shadow:0 0 14px var(--r),0 0 28px var(--r)}
#feed{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
#feed li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,80,110,.15);font-size:.84rem;animation:in .5s var(--e)}
#feed li:last-child{border:0}@keyframes in{from{opacity:0;transform:translateX(-14px)}}
#feed time{color:var(--mu);font-size:.72rem}
.tag{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1)}
.tag.CALL{background:rgba(61,255,176,.15);color:var(--ok);box-shadow:0 0 12px rgba(61,255,176,.3)}
.tag.PUT{background:rgba(255,84,112,.18);color:var(--r2);box-shadow:0 0 12px rgba(255,84,112,.35)}
.tag.W{background:rgba(61,255,176,.15);color:var(--ok)}.tag.L{background:rgba(255,59,92,.18);color:var(--ko)}
.empty{color:var(--mu);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,120px);background:rgba(30,4,12,.85);backdrop-filter:blur(16px);border:1px solid var(--r);box-shadow:0 0 22px rgba(255,31,61,.5);padding:12px 18px;border-radius:14px;font-size:.88rem;transition:transform .5s var(--e);z-index:9;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bg"><i class="aura a1"></i><i class="aura a2"></i><div class="floor"></div>
<svg class="bolts" viewBox="0 0 400 800" preserveAspectRatio="none"><path class="bolt" d="M60 0 L30 180 L92 205 L18 430 L84 450 L8 720"/><path class="bolt" d="M342 0 L372 150 L308 182 L388 385 L330 415 L396 640"/><path class="bolt" d="M200 0 L184 95 L216 110 L188 200 L206 250"/></svg></div>
<main id="app">
<header><svg width="30" height="30" viewBox="0 0 30 30"><path d="M17 2 6 17h7l-2 11 13-16h-8z" fill="#ff1f3d"/></svg><b>DONSXD <span>QUANTUM</span></b><i class="dot" id="dot"></i></header>
<section class="orb" id="orb"><i class="halo"></i><div class="gyro"><i></i><i></i><i></i></div><i class="sweep"></i>
<div class="core"><small>SOLDE</small><strong id="bal">—</strong><div class="state" id="state">Prêt</div></div></section>
<div class="stats"><span class="pill w">Gagnés <i id="w">0</i></span><span class="pill l">Perdus <i id="l">0</i></span></div>
<div class="gow"><button class="go" id="go">Démarrer le bot</button></div>
<section class="card" id="conn"><h2>Connexion</h2>
<label for="pw">Mot de passe de l'appli</label><input id="pw" type="password" autocomplete="off">
<label for="ssid">SSID Pocket Option</label><input id="ssid" type="password" autocomplete="off"></section>
<section class="card" id="cfg"><h2>Réglages</h2>
<label>Timeframe</label><div class="seg" id="tf"><button data-v="5">5s</button><button data-v="15">15s</button><button data-v="30">30s</button><button data-v="60" class="on">1m</button><button data-v="120">2m</button><button data-v="300">5m</button></div>
<label>Force du signal</label><div class="seg" id="sc"><button data-v="2" class="on">Moyen et fort</button><button data-v="3">Fort seulement</button></div>
<label>Martingales</label><div class="step"><button id="mm" aria-label="Moins">−</button><span id="mv">2</span><button id="mp" aria-label="Plus">+</button></div><div class="lad" id="lad"></div>
<div class="g2"><div><label for="amt">Mise de départ</label><input id="amt" type="number" value="1" min="1" step="0.5" inputmode="decimal"></div><div><label for="mul">Multiplicateur</label><input id="mul" type="number" value="2.2" min="1" step="0.1" inputmode="decimal"></div>
<div><label for="mx">Mise max</label><input id="mx" type="number" value="50" inputmode="decimal"></div><div><label for="ml">Stop après X pertes</label><input id="ml" type="number" value="5" min="1" inputmode="numeric"></div></div></section>
<section class="card"><h2>Activité en direct</h2><ul id="feed"></ul><div class="empty" id="empty">Rien pour l'instant. Lance le bot pour voir les trades.</div></section>
</main><div id="toast"></div>
<script>
const $=i=>document.getElementById(i);let M=2,tf=60,sc=2,run=false,busy=false,bal=0,seen=new Set(),first=true;
$("pw").value=sessionStorage.getItem("pw")||"";$("pw").oninput=()=>sessionStorage.setItem("pw",$("pw").value);
const seg=(id,f)=>{const e=$(id);e.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;e.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));f(+b.dataset.v)}};
seg("tf",v=>tf=v);seg("sc",v=>sc=v);
function ladder(step){$("mv").textContent=M;$("lad").innerHTML=Array.from({length:M+1},(_,i)=>`<i class="${i===step?"a":i<step?"p":""}"></i>`).join("")}
$("mm").onclick=()=>{M=Math.max(0,M-1);ladder(0)};$("mp").onclick=()=>{M=Math.min(8,M+1);ladder(0)};ladder(0);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),3200)}
async function api(p,m,b){const r=await fetch(p,{method:m,headers:{"Content-Type":"application/json","x-pw":$("pw").value},body:b?JSON.stringify(b):undefined});
if(!r.ok){let d="Erreur serveur";try{d=(await r.json()).detail||d}catch(e){}throw new Error(d)}return r.json()}
function tween(to){const f=bal,t0=performance.now();bal=to;(function s(t){const k=Math.min(1,(t-t0)/800),v=f+(to-f)*(1-Math.pow(1-k,3));$("bal").textContent=v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});if(k<1)requestAnimationFrame(s)})(t0)}
function bump(id,v){const e=$(id);if(e.textContent!=v){e.textContent=v;const p=e.parentNode;p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump")}}
function add(t){const m=t.match(/^(\d\d:\d\d:\d\d)\s+(.*)$/)||["","",t],li=document.createElement("li"),tm=document.createElement("time"),tg=document.createElement("span"),tx=document.createElement("span");
tm.textContent=m[1];tx.textContent=m[2];tg.className="tag";let x;
if(x=m[2].match(/^(CALL|PUT) (\S+) ([\d.]+) \(force (\d), martingale (\d+)\/(\d+)\)/)){tg.textContent=x[1];tg.classList.add(x[1]);tx.textContent=`${x[2].replace("_otc"," OTC")} · mise ${x[3]} · M${x[5]}`;const r=document.createElement("i");r.className="rip";document.querySelector(".orb").appendChild(r);setTimeout(()=>r.remove(),1500);document.body.classList.add("zap");setTimeout(()=>document.body.classList.remove("zap"),650)}
else if(m[2].includes("Gagné")){tg.textContent="Gagné";tg.classList.add("W");tx.textContent=""}
else if(m[2].includes("Perdu")){tg.textContent="Perdu";tg.classList.add("L");tx.textContent=""}
else{tg.textContent="Info"}
li.append(tm,tg,tx);$("feed").prepend(li);while($("feed").children.length>40)$("feed").lastChild.remove()}
function render(s){run=s.running;document.body.classList.toggle("run",run);$("go").textContent=run?"Arrêter le bot":"Démarrer le bot";
$("conn").classList.toggle("off",run);$("cfg").classList.toggle("off",run);
if(s.balance!=null&&s.balance!==bal)tween(+s.balance);bump("w",s.stats.win);bump("l",s.stats.loss);ladder(s.step);
s.log.forEach(l=>{if(!seen.has(l)){seen.add(l);add(l)}});$("empty").style.display=s.log.length?"none":"block";
const last=s.log[s.log.length-1]||"";$("state").textContent=!run?"Prêt":/(CALL|PUT) /.test(last)?"Trade en cours":"Scan des paires…"}
async function poll(){try{render(await api("/api/status","GET"))}catch(e){document.body.classList.remove("run")}}
$("go").onclick=async()=>{if(busy)return;busy=true;$("go").classList.add("busy");
try{if(run)await api("/api/stop","POST");else{if(!$("ssid").value.trim())throw new Error("Entre ton SSID");
await api("/api/start","POST",{ssid:$("ssid").value.trim(),timeframe:tf,amount:+$("amt").value,martingales:M,multiplier:+$("mul").value,max_stake:+$("mx").value,max_losses:+$("ml").value,min_score:sc})}
await poll()}catch(e){toast(e.message)}busy=false;$("go").classList.remove("busy")};
poll();setInterval(poll,3000);
addEventListener("pointermove",e=>{const o=$("orb");o.style.setProperty("--ry",((e.clientX/innerWidth-.5)*26)+"deg");o.style.setProperty("--rx",(-(e.clientY/innerHeight-.5)*26)+"deg")});
</script></body></html>
